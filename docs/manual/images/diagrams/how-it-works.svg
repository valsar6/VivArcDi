<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>How VivArcDi gets into Vivaldi</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7b"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#f7f9fb"/>

  <g>
    <rect x="30" y="40" width="230" height="150" rx="14" fill="#ffffff" stroke="#c9d3dd"/>
    <text x="50" y="72" font-size="16" font-weight="700" fill="#1d2530">1. Install</text>
    <text x="50" y="100" font-size="13" fill="#44505c">macOS: VivArcDi.app (.dmg)</text>
    <text x="50" y="120" font-size="13" fill="#44505c">or brew install --cask</text>
    <text x="50" y="146" font-size="13" fill="#44505c">Debian: vivarcdi .deb</text>
    <text x="50" y="166" font-size="13" fill="#44505c">or the apt repository</text>
  </g>

  <g>
    <rect x="330" y="20" width="300" height="370" rx="14" fill="#ffffff" stroke="#c9d3dd"/>
    <text x="350" y="52" font-size="16" font-weight="700" fill="#1d2530">2. Inside Vivaldi's files</text>
    <rect x="350" y="70" width="260" height="70" rx="10" fill="#eef3f7"/>
    <text x="366" y="96" font-size="13" font-weight="600" fill="#1d2530">window.html</text>
    <text x="366" y="118" font-size="12" fill="#44505c">+ one line that loads</text>
    <text x="366" y="133" font-size="12" fill="#44505c">  vivarcdi/loader.js</text>
    <rect x="350" y="156" width="260" height="214" rx="10" fill="#eef3f7"/>
    <text x="366" y="182" font-size="13" font-weight="600" fill="#1d2530">vivarcdi/</text>
    <text x="366" y="206" font-size="12" fill="#44505c">loader.js, config.json</text>
    <text x="366" y="226" font-size="12" fill="#44505c">styles/  (the Arc look)</text>
    <text x="366" y="246" font-size="12" fill="#44505c">modules/ (the Arc behavior):</text>
    <text x="378" y="268" font-size="12" fill="#44505c">favorites · pinned · peek</text>
    <text x="378" y="288" font-size="12" fill="#44505c">folders · space header</text>
    <text x="378" y="308" font-size="12" fill="#44505c">today archive · little arc</text>
    <text x="378" y="328" font-size="12" fill="#44505c">incognito · copy url · …</text>
    <text x="366" y="354" font-size="12" fill="#44505c">selectors/ per Vivaldi version</text>
  </g>

  <g>
    <rect x="700" y="40" width="230" height="150" rx="14" fill="#ffffff" stroke="#c9d3dd"/>
    <text x="720" y="72" font-size="16" font-weight="700" fill="#1d2530">3. Start Vivaldi</text>
    <text x="720" y="100" font-size="13" fill="#44505c">The loader reads config.json</text>
    <text x="720" y="120" font-size="13" fill="#44505c">and starts each enabled</text>
    <text x="720" y="140" font-size="13" fill="#44505c">module. One failing module</text>
    <text x="720" y="160" font-size="13" fill="#44505c">never blocks the others.</text>
  </g>

  <g>
    <rect x="700" y="240" width="230" height="150" rx="14" fill="#fff6e8" stroke="#e9cf9f"/>
    <text x="720" y="272" font-size="16" font-weight="700" fill="#1d2530">4. Vivaldi updates</text>
    <text x="720" y="300" font-size="13" fill="#44505c">An update replaces</text>
    <text x="720" y="320" font-size="13" fill="#44505c">window.html. VivArcDi</text>
    <text x="720" y="340" font-size="13" fill="#44505c">notices and applies itself</text>
    <text x="720" y="360" font-size="13" fill="#44505c">again on its own.</text>
  </g>

  <path d="M260 115 L326 115" stroke="#5b6b7b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M630 115 L696 115" stroke="#5b6b7b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M815 190 L815 236" stroke="#5b6b7b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M700 330 L634 330" stroke="#5b6b7b" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
</svg>
