name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: make test-py
      - run: npm run build

  package-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run build
      - name: Use a throwaway keyring while none is committed (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f packaging/apt/vivarcdi-archive-keyring.gpg ]; then
            scripts/make-apt-key.sh --throwaway build/test-key > /dev/null 2>&1
            echo "VIVARCDI_KEYRING=${GITHUB_WORKSPACE}/build/test-key/vivarcdi-archive-keyring.gpg" >> "${GITHUB_ENV}"
          fi
      - run: python3 packaging/debian/build_deb.py --out build
      - run: python3 -m unittest discover -s tests/packaging
      - name: Check the apt enrollment files in the package
        run: |
          contents="$(dpkg-deb --contents build/*.deb)"
          echo "${contents}" | grep -q './etc/apt/sources.list.d/vivarcdi.sources'
          echo "${contents}" | grep -q './usr/share/vivarcdi/vivarcdi-archive-keyring.gpg'
      - name: Build a signed test repository from the package and read it with apt
        run: scripts/check-apt-repo.sh build/vivarcdi_*_all.deb
      - run: sudo apt-get install -y lintian && lintian --fail-on error build/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: vivarcdi-deb
          path: build/*.deb

  package-macos:
    runs-on: macos-latest
    env:
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the universal2 Python from python.org
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/python.pkg" https://www.python.org/ftp/python/3.13.1/python-3.13.1-macos11.pkg
          sudo installer -pkg "${RUNNER_TEMP}/python.pkg" -target /
      - name: Install PyInstaller in a virtual environment
        run: |
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 -m venv build/venv
          build/venv/bin/python -m pip install -r packaging/macos/requirements.txt
      - name: Build the app and the disk image
        run: build/venv/bin/python packaging/macos/build_dmg.py --out build
      - name: Validate the cask with brew audit
        run: |
          version="$(npm run -s release version)"
          tap="$(brew --repository)/Library/Taps/valsar6/homebrew-vivarcdi"
          mkdir -p "${tap}"
          git -C "${tap}" init --quiet
          python3 packaging/homebrew/cask.py --version "${version}" --sha256 "$(printf '0%.0s' $(seq 64))" --out "${tap}/Casks/vivarcdi.rb"
          brew trust valsar6/vivarcdi
          brew trust --cask valsar6/vivarcdi/vivarcdi
          brew audit --cask valsar6/vivarcdi/vivarcdi
      - name: Check the app bundle
        env:
          VIVARCDI_APP_BUNDLE: ${{ github.workspace }}/build/pyinstaller/dist/VivArcDi.app
        run: build/venv/bin/python -m unittest discover -s tests/packaging -p "test_app_bundle.py" -v
      - name: Sign with a Developer ID
        if: env.MACOS_SIGNING_IDENTITY != ''
        run: echo "A Developer ID is configured. Signing and notarizing are not implemented yet, the app keeps its ad hoc signature."
      - uses: actions/upload-artifact@v4
        with:
          name: vivarcdi-dmg
          path: build/VivArcDi-*.dmg

  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: git fetch --depth=1 origin "${{ github.base_ref }}"
      - name: Check the branch name against the version change
        run: npm run -s release -- check --base "origin/${{ github.base_ref }}" --branch "${{ github.head_ref }}"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag and release a new version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(npm run -s release tag)"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists, nothing to release"
            echo "created=false" >> "${GITHUB_OUTPUT}"
          else
            gh release create "${tag}" --target "${GITHUB_SHA}" --title "VivArcDi ${tag}" --generate-notes
            echo "created=true" >> "${GITHUB_OUTPUT}"
          fi

  upload-packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.created == 'true'
    needs: [release, package-deb, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vivarcdi-deb
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: vivarcdi-dmg
          path: packages
      - name: Upload the packages and add the Download section to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          deb="vivarcdi_${version}_all.deb"
          dmg="VivArcDi-${version}.dmg"
          test -f "packages/${deb}"
          test -f "packages/${dmg}"
          gh release upload "${TAG}" "packages/${deb}" "packages/${dmg}" --clobber
          gh release view "${TAG}" --json body --jq .body > notes.md
          if ! grep -q '^## Download' notes.md; then
            base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
            {
              printf '\n## Download\n\n'
              printf -- '- [VivArcDi for macOS (%s)](%s/%s)\n' "${dmg}" "${base}" "${dmg}"
              printf -- '- [VivArcDi for Debian and Ubuntu (%s)](%s/%s)\n' "${deb}" "${base}" "${deb}"
            } >> notes.md
            gh release edit "${TAG}" --notes-file notes.md
          fi

  publish-dist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-dist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble the release tree
        run: |
          mkdir release
          cp -r installer dist docs release/
          cp README.md LICENSE release/
          cp scripts/dist.gitignore release/.gitignore
          find release -name __pycache__ -type d -prune -exec rm -rf {} +
      - name: Check out the dist branch
        run: |
          if git fetch --depth=1 origin dist; then
            git worktree add --detach published FETCH_HEAD
          else
            git worktree add --orphan published
          fi
      - name: Commit the release tree on top of the dist branch
        run: |
          version="$(npm run -s release version)"
          git -C published rm -rq --ignore-unmatch .
          cp -r release/. published/
          git -C published add --all
          git -C published ls-files --error-unmatch dist/loader.js installer/__main__.py > /dev/null
          if git -C published diff --cached --quiet; then
            echo "dist already holds this build, nothing to publish"
            exit 0
          fi
          git config user.name "Salvatore"
          git config user.email "25297596+valsar6@users.noreply.github.com"
          git -C published commit --message "Publish the dist build of VivArcDi ${version} from main at ${GITHUB_SHA::7}"
          git -C published push origin HEAD:refs/heads/dist
          tag="dist-v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists, the dist commit stays untagged"
          else
            git -C published tag "${tag}"
            git -C published push origin "refs/tags/${tag}"
          fi

  publish-tap:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.created == 'true'
    needs: [release, upload-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: publish-tap
      cancel-in-progress: false
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Report that the tap is not configured
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "publish-tap is not configured. Add the HOMEBREW_TAP_TOKEN secret as in docs/package-managers-setup.md. Nothing was published."
      - uses: actions/checkout@v7
        if: env.HOMEBREW_TAP_TOKEN != ''
      - uses: actions/checkout@v7
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          repository: valsar6/homebrew-vivarcdi
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write the cask for the release and push it when it changed
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          gh release download "${TAG}" --pattern "VivArcDi-${version}.dmg" --dir packages --clobber
          python3 packaging/homebrew/cask.py --version "${version}" --dmg "packages/VivArcDi-${version}.dmg" --out tap/Casks/vivarcdi.rb
          ruby -c tap/Casks/vivarcdi.rb
          git -C tap add Casks/vivarcdi.rb
          if git -C tap diff --cached --quiet; then
            echo "The tap already holds ${version}, nothing to publish"
            exit 0
          fi
          git -C tap config user.name "Salvatore"
          git -C tap config user.email "25297596+valsar6@users.noreply.github.com"
          git -C tap commit --message "Update VivArcDi to ${version}"
          git -C tap push origin HEAD

  publish-apt:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.created == 'true'
    needs: [release, upload-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-apt
      cancel-in-progress: false
    env:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
    steps:
      - name: Report that the apt repository is not configured
        if: env.APT_SIGNING_KEY == ''
        run: echo "publish-apt is not configured. Add the APT_SIGNING_KEY secret as in docs/package-managers-setup.md. Nothing was published."
      - uses: actions/checkout@v7
        if: env.APT_SIGNING_KEY != ''
      - uses: actions/setup-python@v7
        if: env.APT_SIGNING_KEY != ''
        with:
          python-version: "3.13"
      - name: Check out the gh-pages branch
        if: env.APT_SIGNING_KEY != ''
        run: |
          if git fetch --depth=1 origin gh-pages; then
            git worktree add --detach published FETCH_HEAD
          else
            git worktree add --orphan published
          fi
      - name: Add the package, sign the indexes and push the site
        if: env.APT_SIGNING_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          gh release download "${TAG}" --pattern "vivarcdi_${version}_all.deb" --dir packages --clobber
          published_at="$(gh release view "${TAG}" --json publishedAt --jq .publishedAt)"
          python3 packaging/apt/apt_repo.py --root published/apt --deb "packages/vivarcdi_${version}_all.deb" --date "${published_at}"
          touch published/.nojekyll
          git -C published add --all
          if git -C published diff --cached --quiet; then
            echo "The apt repository already lists ${version}, nothing to publish"
            exit 0
          fi
          git config user.name "Salvatore"
          git config user.email "25297596+valsar6@users.noreply.github.com"
          git -C published commit --message "Publish VivArcDi ${version} to the apt repository"
          git -C published push origin HEAD:refs/heads/gh-pages
